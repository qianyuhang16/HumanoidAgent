<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Agent × Mem-0 · 配对评测</title>
<style>body{font:16px system-ui;background:#10151e;color:#e7edf7;margin:30px auto;max-width:1200px;padding:0 20px}h1{font-size:28px}p{color:#abbcd3}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px}article{background:#1a2331;padding:20px;border-radius:14px}video,img{width:100%;border-radius:8px}pre{white-space:pre-wrap;max-height:360px;overflow:auto;font:13px monospace}a{color:#80c7ff}.metric{font-size:20px;margin:12px 0}small{color:#abbcd3}</style>
<h1>Agent × IK × Mem-0 · RMBench</h1><p>真实仿真回放与结构化决策。VLA 全程控制，对照 IK 接近后交给 VLA。少量固定种子 smoke test；IK 使用仿真物体位姿。视频按 10 fps 回放，非实时速度。</p><main id="runs"></main>
<script>
async function get(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r}
async function start(){const names=await(await get('runs.json')).json();for(const name of names){const a=document.createElement('article');a.innerHTML='<h2></h2><div class="metric">等待运行</div><img><video controls hidden></video><p class="links"></p><small>Agent 决策与执行结果（每 5 秒刷新）</small><pre></pre>';a.querySelector('h2').textContent=name;a.querySelector('img').src=name+'/media/initial.png';a.querySelector('img').onerror=()=>a.querySelector('img').hidden=true;for(const file of ['summary.json','events.jsonl','physics.jsonl','worker.log']){const link=document.createElement('a');link.href=name+'/'+file;link.textContent=file+' ';a.querySelector('.links').append(link)}document.querySelector('main').append(a);
const refresh=async()=>{try{const text=await(await get(name+'/events.jsonl')).text();const events=text.trim().split('\n').filter(Boolean).map(x=>JSON.parse(x));const selected=events.filter(x=>['decision','handoff_review','result','model_failed','task_finished'].includes(x.event));a.querySelector('pre').textContent=selected.map(x=>JSON.stringify(x,null,2)).join('\n');const chunks=events.filter(x=>x.event==='vla_chunk_executed');if(chunks.length){const last=chunks.at(-1);a.querySelector('.metric').textContent=`运行中 · 进度 ${last.stage}/${last.stage_max??6} · ${chunks.length} 批动作`;a.querySelector('img').hidden=false;const steps=chunks.reduce((s,x)=>s+x.executed,0);const mode=name.startsWith('ik_');const ik=events.filter(x=>x.event==='controller_selected').length;a.querySelector('img').src=last.frame?`${name}/media/${last.frame}`:`${name}/media/frame-${String(steps).padStart(5,'0')}-${mode?ik:0}.png`}}catch(e){}
try{const s=await(await get(name+'/summary.json')).json();a.querySelector('.metric').textContent=`${s.error?'启动失败':s.control_locked||s.final_observation_available===false?'中断（末次观测）':s.physical_success?'成功':'未完成'} · 进度 ${s.physical.stage}/${s.physical.stage_max??6} · ${s.physical.control_steps} VLA 步`;if(s.error)a.querySelector('pre').textContent=s.error;a.querySelector('img').hidden=true;const v=a.querySelector('video');if(!v.src)v.src=name+'/media/rollout.mp4';v.hidden=false;return true}catch(e){return false}};
const timer=setInterval(async()=>{if(await refresh())clearInterval(timer)},5000);if(await refresh())clearInterval(timer)}}start();
</script></html>
