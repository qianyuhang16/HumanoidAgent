<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RGB-D Agent · Grounding DINO + SAM + Mem-0</title>
<style>body{font:16px system-ui;max-width:1160px;margin:32px auto;padding:0 20px;background:#111827;color:#e5e7eb}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px}article{background:#1f2937;padding:20px;border-radius:12px}img,video{width:100%}pre{white-space:pre-wrap;max-height:400px;overflow:auto;font-size:13px}a{color:#93c5fd}.metric{font-size:20px;margin:12px 0}</style>
<h1>RGB-D → Grounding DINO / SAM → Agent → IK / VLA</h1><p>允许 RGB-D、相机标定、关节反馈。检测/分割/视觉判断均可能出错；动作结束不代表任务成功。Agent 结束后才运行模拟器最终评测。<a href="manifest.json">配置与种子</a></p><main></main>
<script>
async function get(p){let r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r}
async function start(){for(const name of await(await get('runs.json')).json()){let a=document.createElement('article');a.innerHTML='<h2></h2><div class="metric">待运行</div><img><video controls hidden></video><p class="links"></p><h3>最新模型分割</h3><img class="overlay" hidden><details><summary>模型读取的局部图：当前 / 初始</summary><img class="details" hidden></details><h3>Agent 工作记忆、决策与感知证据</h3><pre></pre>';a.querySelector('h2').textContent=name;document.querySelector('main').append(a);for(const f of ['summary.json','agent-report.json','events.jsonl','physics.jsonl']){let l=document.createElement('a');l.href=name+'/'+f;l.textContent=f+' ';a.querySelector('.links').append(l)}const refresh=async()=>{try{let es=(await(await get(name+'/events.jsonl')).text()).trim().split('\n').filter(Boolean).map(JSON.parse);let selected=es.filter(e=>['decision','tool_result','perception_assessed','handoff_review','result','task_finished','model_failed'].includes(e.event)||(e.event==='model_response'&&['plan','tool_plan'].includes(e.purpose)&&e.result?.working_memory));a.querySelector('pre').textContent=selected.map(e=>JSON.stringify(e,null,2)).join('\n');let chunks=es.filter(e=>e.event==='vla_chunk_executed');a.querySelector('.metric').textContent='运行中 · '+chunks.reduce((n,e)=>n+e.executed,0)+' VLA 动作';let pic=a.querySelector('img');pic.src=name+'/media/'+(chunks.at(-1)?.frame??'initial.png');let ps=es.filter(e=>e.event==='perception_grounded');if(ps.length){let overlay=a.querySelector('.overlay');overlay.src=name+'/media/'+ps.at(-1).overlay.split('/media/').pop();overlay.hidden=false;if(ps.at(-1).details){let detail=a.querySelector('.details');detail.src=name+'/media/'+ps.at(-1).details.split('/media/').pop();detail.hidden=false}}}catch(e){}try{let s=await(await get(name+'/summary.json')).json();a.querySelector('.metric').textContent=`Agent 宣告：${s.agent_declared_complete?'完成':'未完成'} · 最终评测：${s.physical_success===null?'不可用':s.physical_success?'成功':'失败'} · ${s.model_calls} VLA 批次`;let v=a.querySelector('video');if(!v.src)v.src=name+'/media/rollout.mp4';v.hidden=false;a.querySelector('img').hidden=true;return true}catch(e){return false}};let timer=setInterval(async()=>{if(await refresh())clearInterval(timer)},5000);await refresh()}}
start();
</script></html>
