schema_version: 2
name: Model-directed tool Agent
verification:
  mode: main_agent
model:
  adapter: primitive_vla.agent.model:JSONModel
  options:
    provider: http
    base_url: http://127.0.0.1:8000/v1
    model: replace-with-your-model
    timeout_s: 60
    max_tokens: 4096
# Install an extension and configure its tool provider when needed.
tool_providers: []
limits:
  max_turns: 40
  max_calls: 80
  timeout_s: 300
