schema_version: 2
name: Model-directed tool Agent
model:
  adapter: primitive_vla.agent.model:JSONModel
  options:
    provider: http
    base_url: http://127.0.0.1:8000/v1
    model: replace-with-your-model
    timeout_s: 60
    max_tokens: 4096
tool_providers:
  - adapter: primitive_vla.tools.mock:MockRobot
    options:
      arms: [arm_a, arm_b]
      objects:
        sample: [0.4, 0.1, 0.2]
limits:
  max_turns: 40
  max_calls: 80
  timeout_s: 300
