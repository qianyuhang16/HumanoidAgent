[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-vla"
version = "1.0.0"
description = "Event-driven, provider-independent embodied agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
primitive-vla = "primitive_vla.interfaces.web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"primitive_vla.interfaces.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
