[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-vla"
version = "0.3.0"
description = "Model-directed embodied agent with extensible tools and robot adapters"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.scripts]
primitive-vla = "primitive_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
primitive_vla = ["web/static/tools.html", "web/static/tools.js", "web/static/tools.css"]
