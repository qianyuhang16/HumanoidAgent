# 双臂共用的标定配置；在网页选择左/右臂步骤，单独采集用 --arm。
host: 10.192.73.147
port: 48055
camera: front
urdf: ../assets/reference/piper_description.urdf
base_link: base_link
tip_link: link6
joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
# All robot translations in metres, joint angles in radians. No gripper TCP needed.
board:
  squares_x: 5
  squares_y: 7
  # Measured print: 27.2 mm squares; marker scaled by the same 27.2/30 ratio.
  square_m: 0.0272
  marker_m: 0.01632
  dictionary: DICT_4X4_50
  legacy_pattern: false
capture:
  request_timeout_s: 3.0
  max_age_s: 0.5
  max_skew_s: 0.4
  settle_s: 0.8
  max_joint_motion_rad: 0.008
  min_corners: 12
  min_blur_variance: 25.0
quality:
  min_train: 12
  min_validation: 4
  max_reprojection_px: 1.0
  max_validation_translation_m: 0.020
  max_validation_rotation_deg: 5.0
