# 唯一日常 IK 配置；网页、像素命令、Python 调用共用。
host: 10.192.73.147
port: 48055
calibration_workspace: ../../../../workspace/cobotmagic-calibration
output_workspace: ../../../../workspace/cobotmagic-ik/click-plans

# 原图像素射线与所选臂 base 的这个高度平面相交，单位米。
target_base_z_m: 0.17
# 沿图片向上对应的水平面方向补偿，单位米，不改变高度。
forward_compensation_m:
  left: 0.10
  right: 0.15
orientation: downward  # downward / position / current / rpy
rpy_deg: [0, 0, 0]     # 仅 orientation: rpy 时使用

robot:
  urdf: ../assets/reference/piper_description.urdf
  base_link: base_link
  tip_link: link6
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]

motion:
  move_duration_s: 3.0
  downward_angle_range_deg: [40, 90]  # 优先角度上限，90 度为竖直向下
  preserve_jaw_heading: true         # 保持起点两指连线的水平朝向
  jaw_heading_tolerance_deg: 2.0
  speed_percent: 30                 # 现有桥的驱动速度百分比
  settle_timeout_s: 3.0             # 发完轨迹后等待终点反馈的时间
  position_tolerance_m: 0.008
  orientation_tolerance_rad: 0.04   # 固定 RPY 模式的终点误差
  request_timeout_s: 0.20
  max_feedback_age_s: 0.20
  feedback_limit_tolerance_deg: 2.0  # 实测 VLA 后腕部反馈越界 1.269°；只容忍回读偏差，IK/指令限位不扩大
  max_run_s: 120
