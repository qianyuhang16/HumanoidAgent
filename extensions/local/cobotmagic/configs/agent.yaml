# 复用 cameras.yaml 的模型服务配置，以及 ik.yaml 的标定/运动参数。
model_source: cameras.yaml
ik_config: ik.yaml
# 直接使用已有 robotwin 环境；感知实现在本扩展的 perception/ 中。
python_executable: /home/estar/miniconda3/envs/robotwin/bin/python
# 沿用共享权重目录，不复制或下载模型。
models_dir: ../../../../workspace/tabletop-models
device: cuda
box_threshold: 0.25
inference_timeout_s: 120
# 首次模型加载可能较慢；图像超过现有 IK 的 3 分钟限制必须重新观察。
task_timeout_s: 600
# 两臂到物体的标定平面距离差超过此值时，给 Agent 明确的就近用臂建议。
# 只提供判断依据，不强制绑定手臂，也不更改 VLA 的双臂输出。
arm_preference_distance_margin_m: 0.05
skills:
  - ../skills/pick-bowl/SKILL.md
  - ../skills/pick-cup-blue/SKILL.md

# 可选 system_prompt：通用任务提示。无需给 Agent 规定角色或固定工具顺序。
# 默认由主 Agent 在下一轮决策中判断动作结果，不额外调用模型。
# 切换 independent 时需同时配置 reviewer.adapter/options，示例见 AGENT.md。
verification:
  mode: main_agent

# 单臂复位：选定臂六关节回零，选定夹爪回配置开度；另一臂沿用当前状态保持。
reset:
  joints_rad:
    left: [0, 0, 0, 0, 0, 0]
    right: [0, 0, 0, 0, 0, 0]
  gripper_position_m:
    left: 0.0   # 米，0=闭合；0.08=最大指令开度；null=保持当前开度
    right: 0.0
  duration_s: 3
  fps: 20
  settle_timeout_s: 10
  joint_tolerance_rad: 0.0872664626  # 约 5°；只影响复位到位判断
  gripper_tolerance_m: 0.005         # 5 mm；以实际反馈核对夹爪到位
  feedback_limit_tolerance_deg: 5.0  # 复位专用；不改变 IK 容差或桥的指令限位

vla:
  python_executable: /home/estar/miniconda3/envs/lerobot/bin/python
  source: /home/estar/qyh/agilex_lerobot/src
  device: cuda
  fps: 20
  load_timeout_s: 300
  execution_horizon: 15
  max_guidance_weight: 5
  prefix_attention_schedule: EXP
  queue_threshold: 25
  preparation_tolerance_rad: 0.05
  used_joint_threshold_rad: 0.03
  used_gripper_threshold_m: 0.003
  policies:
    pick_bowl:
      checkpoint: /home/estar/qyh/agilex_lerobot/checkpoints/pick_bowl/pretrained_model
      description: 将碗抓起，搬到桌面中央，放稳并松开；VLA 自选手臂。必须先 IK 移到目标碗上方。
      task: Pick up the bowl and place in the center
      # 初始执行预算，并非已实测完成时间。
      duration_s: 30
      max_duration_s: 60
    blue_cup_pour:
      checkpoint: /home/estar/qyh/agilex_lerobot/checkpoints/pick_blue_cup_full/pretrained_model
      description: 拿起蓝杯，向碗倾倒并放在碗旁；完整双臂输出，由 VLA 自选实际使用的手臂。必须先 IK 接近目标。
      task: Pick up the blue cup, pour into the bowl and place beside the bowl
      # 初始执行预算，并非已实测完成时间；可按模型实际表现调整。
      duration_s: 50
      max_duration_s: 60
