schema_version: 2
name: DeepSeek + Grounded SAM + Depth Anything + GG-CNN + SAPIEN
model:
  adapter: primitive_vla.agent.model:JSONModel
  options:
    provider: http
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    require_api_key: true
    timeout_s: 120
    max_tokens: 8192
    max_images: 4
    json_mode: true
tool_providers:
  - adapter: primitive_vla_tabletop.provider:TabletopTools
    options:
      python_executable: /home/estar/qyh/primitiveVLA/extensions/local/tabletop/.venv-worker/bin/python
      robot_urdf: /home/estar/czx/RoboTwin/assets/embodiments/franka-panda/panda.urdf
      models_dir: ../../../../workspace/tabletop-models
      seed: 7
      object_present: true
      scenario: clear
      depth_mode: rgbd
      device: cuda
instructions:
  - ../instructions/showcase.md
finish_check:
  adapter: primitive_vla_tabletop.evaluation:TabletopFinishCheck
system_prompt: >-
  You control a SAPIEN Panda parallel gripper in a tabletop scene.
  Observe first. Use perception tools to identify the requested object and infer a grasp;
  do not invent positions or IDs. Grounding queries should be in English.
  All perception artifacts must refer to the same observation.
  An IK plan is read-only; its tool description specifies execution preconditions.
  If a target is absent, ambiguous, unreachable or uncertain, report blocked and explain.
  The default geometry uses measured RGB-D, with Depth Anything predictions evaluated separately.
  After lifting, use tabletop.verify and inspect the resulting image before declaring success.
  Report actual evidence and distinguish measured depth from model predictions.
limits:
  max_turns: 80
  max_calls: 100
  timeout_s: 2400
  stop_timeout_s: 8
  history_limit: 40
web:
  host: 127.0.0.1
  port: 8082
