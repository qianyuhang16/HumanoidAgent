[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-vla-tabletop"
version = "0.1.0"
description = "Local SAPIEN Panda and pretrained tabletop grasp tool adapter"
requires-python = ">=3.10"
dependencies = ["primitive-vla>=0.3,<0.4"]

[project.optional-dependencies]
worker = ["sapien==3.0.0b1", "torch>=2.7,<3", "transformers>=4.55,<5", "numpy>=1.26,<2", "scipy>=1.10,<2", "Pillow>=10", "opencv-python-headless>=4.8,<4.12", "imageio[ffmpeg]>=2.34", "huggingface-hub>=0.34,<1"]

[project.scripts]
primitive-tabletop-demo = "primitive_vla_tabletop.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
primitive_vla_tabletop = ["GGCNN-LICENSE.txt", "static/*"]
