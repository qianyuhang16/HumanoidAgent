[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-vla-demo"
version = "0.1.0"
description = "Optional software robot and battery loop examples"
requires-python = ">=3.10"
dependencies = ["primitive-vla>=0.3,<0.4"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
