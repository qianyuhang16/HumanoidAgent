[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-vla-qwen"
version = "0.1.0"
description = "Optional local Qwen3-VL HTTP server"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "Pillow>=10", "torch>=2.7,<3", "transformers>=4.57,<5", "accelerate>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
