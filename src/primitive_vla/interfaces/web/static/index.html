<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181a1b">
  <title>Agent 工作台</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/components/robot-view.css">
  <script src="/static/components/robot-view.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主内容</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="导航">
      <button class="new-task" id="new-task"><span data-icon="plus"></span>新对话</button>
      <nav class="main-nav">
        <a href="#home" data-nav="home"><span data-icon="workspace"></span>对话</a>
        <a href="#memory" data-nav="memory"><span data-icon="database"></span>记忆</a>
        <a href="#tools" data-nav="tools"><span data-icon="tool"></span>工具<span class="nav-count" id="tool-count">0</span></a>
        <a href="#skills" data-nav="skills"><span data-icon="book"></span>Skills<span class="nav-count" id="skill-count">0</span></a>
      </nav>
      <div class="sessions-heading"><span>最近对话</span><button class="icon-button" id="search-button" aria-label="搜索对话"><span data-icon="search"></span></button></div>
      <div class="session-list" id="session-list"></div>
      <button class="text-button sessions-more" id="sessions-more" hidden>加载更多</button>
      <div class="sidebar-bottom">
        <button class="runtime-link" id="runtime-button"><span class="status-dot" id="server-dot"></span><span id="server-label">正在连接工作台</span></button>
        <button class="icon-button" id="theme-button" aria-label="切换浅色主题"><span data-icon="sun"></span></button>
      </div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-button" aria-label="打开导航"><span data-icon="menu"></span></button>
        <strong id="page-title">新对话</strong>
        <button class="icon-button" id="context-button" aria-label="切换机器人面板" title="机器人面板"><span data-icon="panel"></span></button>
      </header>
      <div class="work-area">
        <div class="content" id="content" tabindex="-1">
          <section class="home-view" id="home-view">
            <h1>让机器人做些什么？</h1>
            <form class="composer" id="task-form">
              <label class="sr-only" for="task-input">描述任务</label>
              <textarea id="task-input" rows="3" maxlength="16000" placeholder="输入任务…"></textarea>
              <div class="composer-toolbar"><label class="robot-select-wrap"><span data-icon="robot"></span><select id="robot-select" aria-label="选择机器人"><option value="">未选择机器人</option></select></label><button class="primary-button" id="submit-task" type="submit"><span id="submit-label">发送</span><span data-icon="arrow-up"></span></button></div>
            </form>
            <p class="notice" id="connection-note" hidden></p>
            <div class="starter-grid">
              <button class="starter-card" data-prompt="观察当前环境，报告已知状态和仍需补充的信息。"><span data-icon="eye"></span>观察环境</button>
              <button class="starter-card" data-prompt="查看当前可用能力，并说明完成我的目标还需要哪些信息。"><span data-icon="tool"></span>查看可用能力</button>
            </div>
          </section>
          <section class="task-view" id="task-view" hidden>
            <div class="task-toolbar">
              <div class="view-tabs" role="tablist" aria-label="对话显示方式">
                <button id="chat-tab" role="tab" aria-selected="true" aria-controls="conversation" data-task-mode="chat">对话</button>
                <button id="calls-tab" role="tab" aria-selected="false" aria-controls="timeline" data-task-mode="calls">调用详情</button>
              </div>
              <div class="task-controls"><span id="task-status" class="badge"></span><div class="task-actions" id="task-actions"></div></div>
            </div>
            <div class="notice" id="task-notice" hidden></div>
            <button class="text-button older-events" id="older-events" hidden>加载更早的记录</button>
            <div class="conversation" id="conversation" role="tabpanel" aria-labelledby="chat-tab" aria-live="polite"></div>
            <div class="timeline" id="timeline" role="tabpanel" aria-labelledby="calls-tab" hidden></div>
            <form class="composer reply-composer" id="reply-form" hidden>
              <label class="sr-only" for="reply-input">回复 Agent</label><textarea id="reply-input" rows="2" maxlength="16000" placeholder="继续对话…"></textarea>
              <textarea class="payload-input" id="reply-payload" rows="3" placeholder='{"位置": [1, 2]}' aria-label="附加数据 JSON" hidden></textarea>
              <div class="composer-toolbar"><button class="text-button" id="toggle-payload" type="button"><span data-icon="plus"></span>附加数据</button><button class="primary-button" id="send-reply" type="submit">发送<span data-icon="arrow-up"></span></button></div>
            </form>
          </section>
          <section class="collection-view" id="collection-view" hidden>
            <h1 id="collection-title">记忆</h1>
            <div class="collection-toolbar"><label class="search-field"><span data-icon="search"></span><input id="collection-search" type="search" placeholder="搜索…" aria-label="搜索当前列表"></label><select id="lifetime-filter" aria-label="记忆生命周期"><option value="">全部</option><option value="short">短期</option><option value="long">长期</option></select></div>
            <div class="filter-tabs" id="domain-filters" role="group" aria-label="按工具域筛选"><button class="active" data-domain="">全部</button><button data-domain="state">State</button><button data-domain="execution">Execution</button><button data-domain="verification">Verification</button><button data-domain="planning">Planning</button></div>
            <div id="collection-results"></div><button class="secondary-button load-more" id="load-more" hidden>加载更多</button>
          </section>
        </div>
        <aside class="inspector" id="inspector" aria-label="机器人与任务状态">
          <section id="robot-view" aria-label="机器人视角"></section>
          <div id="inspector-content"></div>
        </aside>
      </div>
    </main>
  </div>
  <dialog id="detail-dialog" class="detail-dialog"><header><h2 id="dialog-title">详情</h2><button class="icon-button" id="close-dialog" aria-label="关闭详情"><span data-icon="x"></span></button></header><div class="dialog-body" id="dialog-body"></div></dialog>
  <dialog id="search-dialog" class="search-dialog"><div class="command-search"><span data-icon="search"></span><input id="session-search" type="search" placeholder="搜索对话或页面…" aria-label="搜索对话或页面"><button class="text-button" id="close-search">关闭</button></div><div id="search-results"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
